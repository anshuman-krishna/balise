name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:packages

  audit:
    # the operating manual section 24: a high-severity advisory in a published
    # package blocks release. the production tree is the blocking one, because
    # it is what a consumer installs. the full tree is reported and does not
    # block, because a dev-only advisory is a thing to fix rather than a thing
    # that stops a merge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: production dependencies, high and above
        run: pnpm audit --prod --audit-level high
      - name: full tree, reported only
        run: pnpm audit --audit-level moderate || true

  reproducibility:
    # the exit test for the measurement contract. slow on purpose, and never
    # moved to a nightly job for being slow.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @balise/runner exec playwright-core install --with-deps chromium
      - run: pnpm test:repro
